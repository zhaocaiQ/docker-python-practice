name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 내려받기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트 도구 설치
        run: python -m pip install --upgrade pip

      - name: 프로젝트 의존성 설치
        run: pip install -r requirements.txt pytest httpx

      - name: 자동 테스트 실행
        run: python -m pytest -v

      - name: Docker 이미지 빌드 확인
        run: docker build -t docker-python-practice .
